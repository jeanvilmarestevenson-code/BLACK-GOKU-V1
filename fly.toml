# fly.toml app configuration file generated for black-goku-v1 on 2026-11-03T13:32:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'black-goku-v1'
primary_region = 'gru'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '10000'

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
